name: Deploy Quran Hub to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'content/**'
      - 'tools/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: learn quran
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate UK pages
        run: |
          python tools/build_uk.py
          python tools/audit_uk.py

      - name: Check credentials and create the Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import json, os, re, time, urllib.request, urllib.error
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          if not token or not account:
              raise SystemExit('Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions.')
          if not re.fullmatch(r'[0-9a-fA-F]{32}', account):
              raise SystemExit('CLOUDFLARE_ACCOUNT_ID must be the 32-character Cloudflare Account ID.')
          base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects'
          headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
          def request(url, method='GET', body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=45) as response:
                  result = json.load(response)
              if not result.get('success'):
                  raise SystemExit('Cloudflare rejected the request: ' + str(result.get('errors', [])))
              return result
          try:
              project = request(base + '/learnquran')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit('Cloudflare account access failed (HTTP ' + str(error.code) + '). Check the Account ID and Pages Edit token permission.')
              project = request(base, 'POST', {'name': 'learnquran', 'production_branch': 'main'})
          current = project['result']
          source = current.get('source') or {}
          config = source.get('config') or {}
          changes = {'build_config': {'build_command': 'python tools/build_uk.py && python tools/audit_uk.py', 'destination_dir': 'public', 'root_dir': ''}}
          if source.get('type') == 'github':
              if config.get('repo_name') != 'learn-quran-pages-website':
                  raise SystemExit('Unexpected source repository; refusing to change deployment settings.')
              config = dict(config)
              config['production_deployments_enabled'] = False
              changes['source'] = {'type': 'github', 'config': config}
          project = request(base + '/learnquran', 'PATCH', changes)['result']
          actual_source = project.get('source') or {}
          if actual_source.get('type') == 'github' and actual_source.get('config', {}).get('production_deployments_enabled') is not False:
              raise SystemExit('Native production auto-deploy was not disabled.')
          print(json.dumps({'project':project['name'],'production_publisher':'GitHub Actions','native_production_deployments_enabled':actual_source.get('config',{}).get('production_deployments_enabled'),'native_build_command':project.get('build_config',{}).get('build_command'),'native_output_directory':project.get('build_config',{}).get('destination_dir')}))
          # A push may have started a native build before its switch was disabled.
          # Let that finite build finish before publishing the authoritative build.
          for attempt in range(12):
              deployments = request(base + '/learnquran/deployments?per_page=10')['result']
              active = [d for d in deployments if d.get('environment')=='production' and d.get('deployment_trigger',{}).get('type')=='github:push' and d.get('latest_stage',{}).get('status') in ('active','idle')]
              if not active:
                  break
              if attempt == 11:
                  raise SystemExit('A native build is still active; refusing a production deployment race.')
              print('Waiting for an already-started native build to finish.')
              time.sleep(5)
          print('Cloudflare Pages project ready: ' + project['name'])

      - name: Deploy website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name=learnquran --branch=main

      - name: Verify every published canonical page
        run: python tools/check_live_uk.py
